name: Collect stats

# GitHub's own schedule is best-effort and often skips runs, so one run keeps collecting
# in a loop (every 10 minutes for ~5.5 hours) and then starts the next run itself.
# The hourly schedule is only a watchdog that restarts the loop if it ever stops.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml", "collect.mjs", "data/backfill.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect every 10 minutes
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            node collect.mjs || echo "collect failed"
            git add -A data
            if git commit -qm "data: $(date -u +%Y-%m-%dT%H:%MZ)"; then
              for i in 1 2 3; do
                git pull -q --rebase origin main && git push -q && break
                sleep 5
              done
            fi
            now=$(date +%s)
            sleep $(( 600 - now % 600 ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
