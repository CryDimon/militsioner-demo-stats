name: Collect stats and publish page

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", ".github/workflows/collect.yml", "collect.mjs", "data/backfill.json", "data/steamdb-daily.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect one sample
        run: node collect.mjs

      - name: Save data
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase -X ours origin main || true
          git push || echo "push failed, next run will retry"

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
